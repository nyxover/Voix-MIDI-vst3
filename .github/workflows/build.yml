name: Build VST3
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect VST3
        shell: bash
        run: |
          mkdir out
          find build -type d -name "*.vst3" -prune -exec cp -R {} out/ \;
          ls -R out | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: VoixMidi-${{ matrix.os }}
          path: out
